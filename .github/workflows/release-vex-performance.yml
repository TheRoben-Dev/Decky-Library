name: Release Vex Performance

on:
  push:
    branches: [main]
    paths: ["vex-performance/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vex-performance
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "vex-performance-v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          ./package.sh

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "vex-performance-v${{ steps.v.outputs.version }}" out/Vex-Performance.zip \
            --title "Vex Performance ${{ steps.v.outputs.version }}" \
            --notes "Install: Decky → Developer → Install Plugin from Zip. Bundles lsfg-vk 2.0.0 (CC BY-NC-ND 4.0, unmodified)."
